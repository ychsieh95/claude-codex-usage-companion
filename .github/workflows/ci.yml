name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CodexUsageCompanion.slnx -m:1 --disable-parallel
      - run: dotnet test CodexUsageCompanion.slnx --configuration Debug --no-restore -p:TreatWarningsAsErrors=true
      - run: dotnet test CodexUsageCompanion.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Vulnerability audit
        run: |
          dotnet list src/CodexUsageCompanion/CodexUsageCompanion.csproj package --vulnerable --include-transitive --no-restore
          dotnet list tests/CodexUsageCompanion.Tests/CodexUsageCompanion.Tests.csproj package --vulnerable --include-transitive --no-restore
      - run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: codex-usage-companion
          path: |
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
