name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CodexUsageCompanion.slnx -m:1 --disable-parallel

      - name: Build release artifacts
        run: bash scripts/build-linux.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            artifacts/*.deb
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          )

          notes_file="$RUNNER_TEMP/release-notes.md"
          scripts/changelog-notes.sh "$GITHUB_REF_NAME" > "$notes_file"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing assets."

            gh release upload \
              "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --clobber

            gh release edit \
              "$GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              "${assets[@]}" \
              --notes-file "$notes_file" \
              --title "Codex Usage Companion $GITHUB_REF_NAME"
          fi

      - name: Publish marketplace branch
        shell: bash
        run: |
          staging="$RUNNER_TEMP/codex-usage-companion-marketplace"

          # Copy marketplace files outside the repository before cleaning it.
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -a artifacts/marketplace/. "$staging/"

          # Create a branch with no parent commit.
          git switch --orphan marketplace-build

          # Remove untracked and ignored build files left in the working tree.
          # The staging directory is under RUNNER_TEMP, so it is not removed.
          git clean -fdx

          # Restore only the marketplace files.
          cp -a "$staging/." .

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Publish marketplace $GITHUB_REF_NAME"
          git push origin HEAD:marketplace --force
